<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บอร์ดจัดอันดับ | ST8 CP-Grader</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style> body { font-family: 'Kanit', sans-serif; background-color: #070913; color: #f3f4f6; } .glass-card { background: rgba(18, 22, 38, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); } </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <header class="sticky top-0 z-40 glass-card border-b border-white/5 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
      <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-2.5 rounded-2xl text-white font-bold text-lg flex items-center justify-center w-10 h-10"><i class="fa-solid fa-code"></i></div>
      <div><h1 class="font-bold text-base tracking-wide text-white">ST8 CP-Grader</h1><p class="text-[10px] text-indigo-300">Leaderboard</p></div>
    </div>
    <div class="flex items-center gap-3">
      <a href="index.html" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-xl text-xs transition"><i class="fa-solid fa-house mr-1"></i> หน้าหลัก</a>
      <a href="problems.html" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs transition"><i class="fa-solid fa-laptop-code mr-1"></i> คลังโจทย์</a>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-6 py-12 space-y-6 w-full">
    <div class="text-center">
      <h2 class="text-2xl font-bold text-white mb-1"><i class="fa-solid fa-trophy text-amber-400 mr-2"></i> บอร์ดจัดอันดับผู้ประลองโค้ด (Ranking)</h2>
      <p class="text-xs text-gray-400">รายชื่อผู้ทำคะแนนสะสม XP สูงสุดในระบบ (ทุกคนสามารถเข้ามาตรวจสอบได้)</p>
    </div>

    <div class="glass-card rounded-2xl overflow-hidden border border-white/10">
      <table class="w-full text-left text-xs">
        <thead class="bg-white/5 text-gray-400 border-b border-white/10">
          <tr><th class="p-4">อันดับ</th><th class="p-4">ชื่อผู้ใช้งาน (Username)</th><th class="p-4 text-right">คะแนนสะสม (XP)</th></tr>
        </thead>
        <tbody id="fullRankingTable" class="divide-y divide-white/5">
          <tr><td colspan="3" class="p-4 text-center text-gray-400">กำลังโหลดตารางคะแนน...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="glass-card border-t border-white/5 py-6 text-center text-xs text-gray-400 mt-auto">
    <p>ST8 CP-Grader &bull; Leaderboard System</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://hqnmfkafwwnjiqpdhzoh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxbm1ma2Fmd3duamlxcGRoem9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMTc0NzEsImV4cCI6MjEwOTc5MzQ3MX0.m6dHtNnXuQ108DvafyKWeFvAg_oySuQH3LRg0Jzaops';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchFullRanking() {
      const { data: rankingList } = await supabaseClient.from('profiles').select('*').order('xp', { ascending: false });
      const tableBody = document.getElementById('fullRankingTable');
      if (rankingList && rankingList.length > 0) {
        tableBody.innerHTML = rankingList.map((r, index) => `
          <tr class="hover:bg-white/5 transition">
            <td class="p-4 font-bold text-amber-400">#${index + 1}</td>
            <td class="p-4 font-semibold text-white">${r.display_name || 'Anonymous'}</td>
            <td class="p-4 text-right text-indigo-300 font-bold">${r.xp || 0} XP</td>
          </tr>
        `).join('');
      } else {
        tableBody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-400">ยังไม่มีข้อมูลในระบบ Ranking</td></tr>`;
      }
    }
    fetchFullRanking();
  </script>
</body>
</html>
